<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
  <title id="title">Your code enqueues tasks through Pendenz in your own transaction; an AI agent does the same through MCP tools. Pendenz runs your handlers and keeps the tasks as rows in your PostgreSQL tables, which your UI, scripts and operators read and change with plain SQL.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#656c76"/>
    </marker>
  </defs>
  <rect x="40" y="120" width="880" height="150" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="146" font-size="13" font-weight="600" letter-spacing="0.06em" fill="#9198a1">YOUR JVM</text>
  <rect x="90" y="170" width="170" height="56" rx="10" fill="#212830" stroke="#3d444d" stroke-width="1.5"/>
  <text x="175.0" y="203.0" text-anchor="middle" font-size="14" font-weight="500" fill="#e6edf3">Your code</text>
  <rect x="390" y="158" width="180" height="80" rx="10" fill="#0d2449" stroke="#4493f8" stroke-width="1.5"/>
  <text x="480.0" y="194.0" text-anchor="middle" font-size="16" font-weight="600" fill="#79c0ff">Pendenz</text>
  <text x="480.0" y="213.0" text-anchor="middle" font-size="14" font-weight="500" fill="#9198a1">queue and worker</text>
  <rect x="700" y="170" width="170" height="56" rx="10" fill="#212830" stroke="#3d444d" stroke-width="1.5"/>
  <text x="785.0" y="203.0" text-anchor="middle" font-size="14" font-weight="500" fill="#e6edf3">Your handlers</text>
  <path d="M260 198 H384" fill="none" stroke="#656c76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="325" y="176" text-anchor="middle" font-size="13" fill="#9198a1">enqueue in</text>
  <text x="325" y="193" text-anchor="middle" font-size="13" fill="#9198a1">your transaction</text>
  <path d="M570 198 H694" fill="none" stroke="#656c76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="635" y="189" text-anchor="middle" font-size="13" fill="#9198a1">run</text>
  <rect x="405" y="20" width="150" height="48" rx="10" fill="#212830" stroke="#3d444d" stroke-width="1.5"/>
  <text x="480.0" y="49.0" text-anchor="middle" font-size="14" font-weight="500" fill="#e6edf3">AI agent</text>
  <path d="M480 68 V152" fill="none" stroke="#656c76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="100" text-anchor="start" font-size="13" fill="#9198a1">MCP tools</text>
  <path d="M480 238 V322" fill="none" stroke="#656c76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="293" text-anchor="start" font-size="13" fill="#9198a1">insert, claim with SKIP LOCKED,</text>
  <text x="492" y="310" text-anchor="start" font-size="13" fill="#9198a1">record the outcome</text>
  <path d="M360 340 V450 A120 16 0 0 0 600 450 V340" fill="#0f2a1b" stroke="#3fb950" stroke-width="1.5"/>
  <ellipse cx="480" cy="340" rx="120" ry="16" fill="#133824" stroke="#3fb950" stroke-width="1.5"/>
  <text x="480" y="390" text-anchor="middle" font-size="16" font-weight="600" fill="#7ee787">PostgreSQL</text>
  <text x="480" y="412" text-anchor="middle" font-size="14" fill="#9198a1">your business tables</text>
  <text x="480" y="431" text-anchor="middle" font-size="14" fill="#9198a1">and your task table</text>
  <rect x="90" y="372" width="170" height="64" rx="10" fill="#212830" stroke="#3d444d" stroke-width="1.5"/>
  <text x="175.0" y="400.0" text-anchor="middle" font-size="14" font-weight="500" fill="#e6edf3">Your UI, scripts,</text>
  <text x="175.0" y="419.0" text-anchor="middle" font-size="14" font-weight="500" fill="#e6edf3">operators</text>
  <path d="M260 404 H354" fill="none" stroke="#656c76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="307" y="394" text-anchor="middle" font-size="13" fill="#9198a1">plain SQL</text>
</svg>
