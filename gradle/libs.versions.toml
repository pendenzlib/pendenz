[versions]
# Language and build
kotlin = "2.4.21"

# Core
# The floor: the lowest versions a supported Spring Boot line pins (ADR 0024). Libraries are
# compiled against these; raise them only when that line moves. Renovate leaves them alone.
coroutines = "1.10.2"
serialization = "1.9.0"
# The newest releases, for the second test run of core and core-java. Renovate raises these.
coroutines-latest = "1.11.0"
serialization-latest = "1.12.0"
# The oldest Kotlin a supported framework line ships; compatibility/ compiles a consumer with it.
kotlin-floor = "2.2.21"
slf4j = "2.0.20"

# Modules
jackson = "3.2.4"
mcp = "2.1.0"
# Newer than the one the MCP SDK brings along, which has known vulnerabilities.
reactor = "3.8.8"
jakarta-servlet = "6.0.0"
# The oldest line still in open-source support (ADR 0022); applications bring their newer one.
micrometer = "1.16.8"
# pendenz-spring compiles against the last line of Spring 6 and is tested against 7 as well (ADR 0023).
spring = "6.2.19"
spring7 = "7.0.10"
# pendenz-spring-boot-starter compiles against the oldest line of Boot 4 (ADR 0023).
spring-boot = "4.0.9"

# Examples
hikaricp = "7.1.0"
postgresql = "42.7.14"
flyway = "13.10.3"
logback = "1.6.5"

# Tests
junit = "6.1.3"
assertj = "3.27.7"
testcontainers = "1.21.4"
awaitility = "4.3.0"
embedded-postgres = "2.2.2"
# The PostgreSQL major of the embedded fallback, the same as the Testcontainers image (ADR 0004).
embedded-postgres-binaries = "17.11.0"
# JPA for the transaction tests: the lines Spring 6.2 and Spring 7 / Boot 4.0 run with.
hibernate = "6.6.59.Final"
hibernate7 = "7.2.25.Final"
jetty = "12.1.14"

# Quality
ktlint-plugin = "14.2.0"
ktlint = "1.8.0"
detekt = "1.23.8"
kover = "0.9.11"
bcv = "0.18.2"
dokka = "2.2.0"
maven-publish = "0.37.0"
# Only for examples/spring, built the way Spring Initializr sets a service up.
dependency-management = "1.1.7"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core-latest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines-latest" }
kotlinx-serialization-json-latest = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-latest" }
kotlin-compiler-floor = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin-floor" }
kotlin-stdlib-floor = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-floor" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
mcp-core = { module = "io.modelcontextprotocol.sdk:mcp-core", version.ref = "mcp" }
mcp-json-jackson3 = { module = "io.modelcontextprotocol.sdk:mcp-json-jackson3", version.ref = "mcp" }
reactor-core = { module = "io.projectreactor:reactor-core", version.ref = "reactor" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
spring-jdbc = { module = "org.springframework:spring-jdbc", version.ref = "spring" }
spring-orm = { module = "org.springframework:spring-orm", version.ref = "spring" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
spring-boot-configuration-metadata = { module = "org.springframework.boot:spring-boot-configuration-metadata", version.ref = "spring-boot" }

hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
awaitility-kotlin = { module = "org.awaitility:awaitility-kotlin", version.ref = "awaitility" }
embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "embedded-postgres" }
embedded-postgres-binaries-bom = { module = "io.zonky.test.postgres:embedded-postgres-binaries-bom", version.ref = "embedded-postgres-binaries" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate" }
jetty-ee10-servlet = { module = "org.eclipse.jetty.ee10:jetty-ee10-servlet", version.ref = "jetty" }

# Plugin artifacts for build-logic
plugin-kotlin-jvm = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-kotlin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
plugin-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-plugin" }
plugin-detekt = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
plugin-kover = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
plugin-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
plugin-maven-publish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
plugin-kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
plugin-spring-boot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
plugin-dependency-management = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "dependency-management" }

[plugins]
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
bcv = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
