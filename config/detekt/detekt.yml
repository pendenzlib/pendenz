# Adds to detekt's defaults (buildUponDefaultConfig = true).
build:
  maxIssues: 0

style:
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    max: 3
  ForbiddenComment:
    active: false
  # Neither ktlint in this setup nor the compiler reports them.
  UnusedImports:
    active: true

naming:
  FunctionNaming:
    # Test names in backticks with spaces are intended.
    ignoreAnnotated: ["Test", "ParameterizedTest"]

complexity:
  LongParameterList:
    functionThreshold: 7
    constructorThreshold: 8
